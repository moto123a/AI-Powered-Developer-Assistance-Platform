name: Deploy Frontend to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/coopilotx/frontend
            git pull origin main
            docker build --no-cache \
              --build-arg NEXT_PUBLIC_BACKEND_URL=https://coopilotxai.com \
              --build-arg NEXT_PUBLIC_SPEECHMATICS_RT_HOST=us.rt.speechmatics.com \
              -t coopilotx-frontend .
            docker rm -f coopilotx-frontend || true
            docker run -d \
              --name coopilotx-frontend \
              --restart always \
              -p 3000:3000 \
              -e PORT=3000 \
              --env-file ~/coopilotx/.env \
              coopilotx-frontend
            echo "Deployed successfully"
