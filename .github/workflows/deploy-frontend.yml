name: Deploy Frontend to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e

            cd ~/frontend

            # Pull latest code
            git pull origin main

            # Build new Docker image
            docker build -t coopilotx-frontend .

            # Stop and remove old container
            docker stop coopilotx-frontend || true
            docker rm coopilotx-frontend || true

            # Start new container with env file
            docker run -d \
              --name coopilotx-frontend \
              --restart always \
              -p 3000:3000 \
              --env-file .env.local \
              coopilotx-frontend

            echo "Deployed successfully"
